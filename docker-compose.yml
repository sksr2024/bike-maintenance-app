services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bike_maintenance
      POSTGRES_PASSWORD: bike_maintenance
      POSTGRES_DB: bike_maintenance_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bike_maintenance
      POSTGRES_PASSWORD: bike_maintenance
      POSTGRES_DB: bike_maintenance_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres-data:
